<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>统一客户端导入</title><style>body{font:17px/1.7 system-ui;background:#edf3fa;color:#183149}main{max-width:760px;margin:35px auto;padding:24px}input,textarea{display:block;box-sizing:border-box;width:100%;padding:12px;margin:12px 0;font:inherit}button,a{margin:10px 10px 10px 0}button{padding:12px;background:#235ca4;color:white;border:0;border-radius:8px}section{background:white;padding:22px;border-radius:15px;margin:20px 0}</style><main><h1>一张分享网页，按软件导入</h1><p>Surge · 小火箭 · v2rayN。只有管理员能生成分享；打开网页不会擅自导入。</p><section><label>管理密钥<input id="key" type="password" autocomplete="off"></label><label>分享名称<input id="name" maxlength="80"></label><label>HTTPS 订阅或节点分享链接<textarea id="source" rows="5"></textarea></label><button id="create">生成私有分享网页</button><button id="list">查看已有分享</button><p id="status" role="status"></p></section><section id="items"></section><p>源格式：节点 URI 或 Base64 节点订阅，不接受 Clash YAML。VLESS 等不能直接转成 Surge 协议。分享链接含访问凭据，建议给朋友独立节点账号。</p></main><script>
const $=id=>document.getElementById(id);
async function api(path='',method='GET',body){const r=await fetch('api/shares'+path,{method,headers:{Authorization:'Bearer '+$('key').value,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});const v=await r.json();if(!r.ok)throw Error(v.detail||'请求失败');return v}
async function list(){$('items').replaceChildren();for(const row of await api()){const p=document.createElement('p'),a=document.createElement('a'),b=document.createElement('button');a.textContent=row.name;a.href=row.url;b.textContent='撤销分享';b.onclick=async()=>{if(!confirm('撤销后所有软件入口都会失效，确定吗？'))return;try{await api('/'+row.id,'DELETE');await list()}catch(e){$('status').textContent=e.message}};p.append(a,b);$('items').append(p)}}
$('list').onclick=()=>list().catch(e=>$('status').textContent=e.message);
$('create').onclick=async()=>{$('create').disabled=true;try{const v=await api('','POST',{name:$('name').value||'我的分享',source:$('source').value});$('source').value='';$('status').textContent='已生成，识别到 '+v.count+' 条节点。点击下方名称打开分享页，再复制网址给朋友。';await list()}catch(e){$('status').textContent=e.message}finally{$('create').disabled=false}};
</script></html>
