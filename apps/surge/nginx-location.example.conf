# Insert ONLY inside your existing HTTPS server block. Never replace its listen/server_name.
location = /subscription { return 302 /subscription/; }
location /subscription/ {
    client_max_body_size 8k;
    access_log off;
    error_log /dev/null;
    proxy_pass http://127.0.0.1:8771/;
    proxy_set_header Host $host;
    proxy_read_timeout 120s;
}
